name: Webversie publiceren (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  # Commits van de weekrapport-workflow starten geen push-workflow,
  # dus publiceer ook na elke afgeronde weekrapport-run.
  workflow_run:
    workflows: ["Hardloop-weekrapport"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
